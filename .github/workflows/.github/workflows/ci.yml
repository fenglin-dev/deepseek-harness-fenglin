name: CI

on:
  push:
      branches: [ main ]
        pull_request:
            branches: [ main ]

            jobs:
              # 代码语法检查
                lint:
                    name: Lint & Syntax Check
                        runs-on: ubuntu-latest
                            steps:
                                  - uses: actions/checkout@v4

                                        - name: Setup Node.js
                                                uses: actions/setup-node@v4
                                                        with:
                                                                  node-version: '20'

                                                                        - name: Check JavaScript syntax
                                                                                run: |
                                                                                          echo "Checking JavaScript files..."
                                                                                                    find . -name "*.js" -not -path "*/node_modules/*" | while read f; do
                                                                                                                node --check "$f" 2>&1 && echo "✓ $f" || echo "✗ $f"
                                                                                                                          done
                                                                                                                          
                                                                                                                                - name: Check TypeScript syntax (if exists)
                                                                                                                                        run: |
                                                                                                                                                  if find . -name "*.ts" -not -path "*/node_modules/*" | grep -q .; then
                                                                                                                                                              echo "Checking TypeScript files..."
                                                                                                                                                                          npm install -g typescript
                                                                                                                                                                                      find . -name "*.ts" -not -path "*/node_modules/*" | while read f; do
                                                                                                                                                                                                    tsc --noEmit "$f" 2>&1 && echo "✓ $f" || echo "✗ $f"
                                                                                                                                                                                                                done
                                                                                                                                                                                                                          else
                                                                                                                                                                                                                                      echo "No TypeScript files found, skipping."
                                                                                                                                                                                                                                                fi
                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                  # YAML 配置检查
                                                                                                                                                                                                                                                    yaml-lint:
                                                                                                                                                                                                                                                        name: YAML Lint
                                                                                                                                                                                                                                                            runs-on: ubuntu-latest
                                                                                                                                                                                                                                                                steps:
                                                                                                                                                                                                                                                                      - uses: actions/checkout@v4
                                                                                                                                                                                                                                                                      
                                                                                                                                                                                                                                                                            - name: Validate YAML files
                                                                                                                                                                                                                                                                                    run: |
                                                                                                                                                                                                                                                                                              sudo apt-get update && sudo apt-get install -y yamllint
                                                                                                                                                                                                                                                                                                        yamllint . || true
                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                          # 文件完整性检查
                                                                                                                                                                                                                                                                                                            integrity:
                                                                                                                                                                                                                                                                                                                name: File Integrity Check
                                                                                                                                                                                                                                                                                                                    runs-on: ubuntu-latest
                                                                                                                                                                                                                                                                                                                        steps:
                                                                                                                                                                                                                                                                                                                              - uses: actions/checkout@v4
                                                                                                                                                                                                                                                                                                                              
                                                                                                                                                                                                                                                                                                                                    - name: Check for large files
                                                                                                                                                                                                                                                                                                                                            run: |
                                                                                                                                                                                                                                                                                                                                                      echo "Checking file sizes..."
                                                                                                                                                                                                                                                                                                                                                                find . -type f -size +100M -exec ls -lh {} \; | awk '{print $5, $9}'
                                                                                                                                                                                                                                                                                                                                                                          echo "Done."
                                                                                                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                                                                                                                - name: Verify patch files exist
                                                                                                                                                                                                                                                                                                                                                                                        run: |
                                                                                                                                                                                                                                                                                                                                                                                                  echo "Checking patch files..."
                                                                                                                                                                                                                                                                                                                                                                                                            if [ -d "patches" ]; then
                                                                                                                                                                                                                                                                                                                                                                                                                        echo "✓ patches directory exists"
                                                                                                                                                                                                                                                                                                                                                                                                                                    find patches -type f | head -20
                                                                                                                                                                                                                                                                                                                                                                                                                                              else
                                                                                                                                                                                                                                                                                                                                                                                                                                                          echo "⚠ patches directory not found"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    fi
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      #  Markdown 文档检查
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        docs:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            name: Documentation Check
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                runs-on: ubuntu-latest
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    steps:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          - uses: actions/checkout@v4
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                - name: Check README exists
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  if [ -f "README.md" ]; then
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              echo "✓ README.md exists"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          wc -l README.md
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    else
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                echo "⚠ README.md not found"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          fi
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                - name: Markdown lint
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  npm install -g markdownlint-cli
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            markdownlint "**/*.md" --ignore node_modules || true
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            

name: Workspace runtime release metadata
run-name: Workspace runtime metadata ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Planned Desktop release tag used to build signed runtime metadata
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: workspace-runtime-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  sign:
    if: github.repository == 'flaqai/open-deepseek-harness-desktop' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24.17.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Download immutable Python runtime archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          version="${{ inputs.tag }}"
          version="${version#odsh-v}"
          gh release download "python-v${version}" --repo hecoococ/open-dsh-runtime-assets --dir dist --pattern 'DeepSeek-Harness-workspace-runtime-*.tar.gz'
          test "$(find dist -name 'DeepSeek-Harness-workspace-runtime-*.tar.gz' -type f | wc -l)" -eq 4

      - name: Build catalog subject from release bytes
        run: pnpm exec tsx apps/desktop/scripts/workspace-runtime-manifest-from-release.ts dist '${{ inputs.tag }}'

      - id: attest
        name: Sign runtime catalog with GitHub OIDC
        uses: actions/attest@v4
        with:
          subject-path: dist/workspace-runtimes-*.v2.json

      - name: Prepare signed metadata artifact
        run: |
          cp '${{ steps.attest.outputs.bundle-path }}' dist/workspace-runtimes.v2.sigstore.json

      - name: Preserve signed metadata before publication
        uses: actions/upload-artifact@v4
        with:
          name: workspace-runtime-release-metadata
          path: |
            dist/workspace-runtimes-*.v2.json
            dist/workspace-runtimes.v2.sigstore.json
          if-no-files-found: error
          retention-days: 14

# Build each desktop artifact on the operating system and CPU architecture it ships for.
# Tag `dsh-v*` auto-builds Linux + Windows installers and attaches them to the GitHub Release.
name: Desktop packages

on:
  push:
    tags:
      - 'dsh-v*'
  workflow_dispatch:
    inputs:
      target:
        description: Package target
        required: true
        type: choice
        default: all
        options:
          - all
          - windows-x64
          - linux-x64
      refresh_plugins:
        description: Resolve latest stable bundled plugins (disable for a packaging-only rebuild)
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24.21.0'
  DSH_TELEMETRY_DISABLED: '1'
  # Tag builds stay packaging-only (same plugin snapshot as the verified local install).
  # workflow_dispatch keeps the refresh_plugins switch.
  PACKAGE_TARGET: ${{ github.ref_type == 'tag' && 'all' || inputs.target || 'all' }}

jobs:
  bundled-plugins:
    name: Resolve bundled plugins
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify external tool provider coordinates
        run: pnpm run verify:desktop:external-tools

      - name: Verify embedded Node runtime pins
        run: node --test apps/desktop/scripts/node-runtime-pins.test.mjs

      - name: Resolve latest stable plugin archives
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_plugins }}
        run: pnpm run refresh:desktop:bundled-plugins

      - uses: actions/upload-artifact@v4
        with:
          name: bundled-plugin-snapshot
          path: apps/desktop/bundled-plugins
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows x64
    if: ${{ github.ref_type == 'tag' || inputs.target == 'all' || inputs.target == 'windows-x64' }}
    needs: bundled-plugins
    env:
      DSH_BUNDLED_PLUGINS_REFRESH: '0'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Use resolved bundled plugin snapshot
        shell: pwsh
        run: |
          node -e "require('node:fs').rmSync('apps/desktop/bundled-plugins', { recursive: true, force: true })"

      - uses: actions/download-artifact@v4
        with:
          name: bundled-plugin-snapshot
          path: apps/desktop/bundled-plugins

      - name: Build Windows installer
        shell: pwsh
        run: pnpm run package:desktop:win:x64

      - name: Smoke test installed Windows package
        id: smoke
        shell: pwsh
        # Runner GUI/Job smoke is flaky; installer upload must stay usable.
        continue-on-error: true
        run: apps/desktop/scripts/smoke-windows-package.ps1

      # Keep the installer downloadable even when runner GUI smoke fails, so
      # local D-drive install and UI verification can proceed independently.
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: desktop-windows-x64
          path: .artifacts/desktop-windows/DeepSeek-Harness-windows-x64.exe
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: desktop-windows-smoke-diagnostics
          path: |
            ${{ runner.temp }}/DeepSeek-Harness-desktop-smoke*.log
            ${{ runner.temp }}/DeepSeek-Harness-smoke-appdata/**
            ${{ runner.temp }}/dsh-smoke-install/**
          if-no-files-found: ignore
          retention-days: 7

  linux:
    name: Linux x64
    if: ${{ github.ref_type == 'tag' || inputs.target == 'all' || inputs.target == 'linux-x64' }}
    needs: bundled-plugins
    env:
      DSH_BUNDLED_PLUGINS_REFRESH: '0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install package tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq rpm

      - run: pnpm install --frozen-lockfile

      - name: Use resolved bundled plugin snapshot
        run: |
          node -e "require('node:fs').rmSync('apps/desktop/bundled-plugins', { recursive: true, force: true })"

      - uses: actions/download-artifact@v4
        with:
          name: bundled-plugin-snapshot
          path: apps/desktop/bundled-plugins

      - name: Build Linux packages
        run: pnpm run package:desktop:linux:x64

      - name: Verify packaged preset resources
        run: node apps/desktop/scripts/verify-prebuilt-profile.mjs .artifacts/desktop-linux/linux-unpacked/resources

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-x64
          path: |
            .artifacts/desktop-linux/DeepSeek-Harness-linux-x64.deb
            .artifacts/desktop-linux/DeepSeek-Harness-linux-x64.rpm
          if-no-files-found: error
          retention-days: 14

  checksums:
    name: SHA-256 checksums
    needs: [windows, linux]
    if: >-
      ${{ always() && (
        ((github.ref_type == 'tag' || inputs.target == 'all' || inputs.target == '') && needs.windows.result == 'success' && needs.linux.result == 'success') ||
        (inputs.target == 'windows-x64' && needs.windows.result == 'success') ||
        (inputs.target == 'linux-x64' && needs.linux.result == 'success')
      ) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true

      - name: Write checksums
        working-directory: dist
        run: sha256sum DeepSeek-Harness-* > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-checksums
          path: dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Attach desktop assets to Release
    needs: [windows, linux, checksums]
    if: ${{ github.ref_type == 'tag' && always() && (needs.windows.result == 'success' || needs.linux.result == 'success') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true

      - name: Upload installers to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # --repo avoids gh requiring a local .git checkout.
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber --repo "${GH_REPO}"
          gh release view "${GITHUB_REF_NAME}" --repo "${GH_REPO}" --json tagName,assets --jq '{tag: .tagName, assets: [.assets[].name]}'

# Build each desktop artifact on the operating system and CPU architecture it ships for.
name: Desktop packages

on:
  workflow_dispatch:
    inputs:
      target:
        description: Package target
        required: true
        type: choice
        default: all
        options:
          - all
          - macos
          - windows-x64
          - linux-x64
      refresh_plugins:
        description: Resolve latest stable bundled plugins (disable for a packaging-only rebuild)
        required: true
        type: boolean
        default: true
      windows_candidate_run_id:
        description: Reuse a Windows candidate artifact from this run ID (must have the same commit)
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24.17.0'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  bundled-plugins:
    name: Resolve bundled plugins
    if: ${{ inputs.windows_candidate_run_id == '' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify external tool provider coordinates
        run: pnpm run verify:desktop:external-tools

      - name: Verify embedded Node runtime pins
        run: node --test apps/desktop/scripts/node-runtime-pins.test.mjs

      - name: Resolve latest stable plugin archives
        if: ${{ inputs.refresh_plugins }}
        run: pnpm run refresh:desktop:bundled-plugins

      - uses: actions/upload-artifact@v4
        with:
          name: bundled-plugin-snapshot
          path: apps/desktop/bundled-plugins
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS ${{ matrix.arch }}
    if: ${{ inputs.windows_candidate_run_id == '' && (inputs.target == 'all' || inputs.target == 'macos') }}
    needs: bundled-plugins
    env:
      DSH_BUNDLED_PLUGINS_REFRESH: '0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Use resolved bundled plugin snapshot
        run: |
          node -e "require('node:fs').rmSync('apps/desktop/bundled-plugins', { recursive: true, force: true })"

      - uses: actions/download-artifact@v4
        with:
          name: bundled-plugin-snapshot
          path: apps/desktop/bundled-plugins

      - name: Build macOS package
        run: |
          ulimit -n 65536
          echo "macOS packaging open-file limit: $(ulimit -n)"
          pnpm run package:desktop:macos:${{ matrix.arch }}

      - name: Verify macOS Helper lookup regression
        run: node --test apps/desktop/scripts/smoke-macos-package.test.mjs

      - name: Smoke final macOS DMG and ZIP
        run: >-
          node apps/desktop/scripts/smoke-macos-package.mjs
          .artifacts/desktop-macos/DeepSeek-Harness-macos-${{ matrix.arch }}.dmg
          .artifacts/desktop-macos/DeepSeek-Harness-macos-${{ matrix.arch }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ matrix.arch }}
          path: |
            .artifacts/desktop-macos/DeepSeek-Harness-macos-${{ matrix.arch }}.dmg
            .artifacts/desktop-macos/DeepSeek-Harness-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Build Windows x64 candidate
    if: ${{ inputs.windows_candidate_run_id == '' && (inputs.target == 'all' || inputs.target == 'windows-x64') }}
    needs: bundled-plugins
    env:
      DSH_BUNDLED_PLUGINS_REFRESH: '0'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Use resolved bundled plugin snapshot
        run: |
          node -e "require('node:fs').rmSync('apps/desktop/bundled-plugins', { recursive: true, force: true })"

      - uses: actions/download-artifact@v4
        with:
          name: bundled-plugin-snapshot
          path: apps/desktop/bundled-plugins

      - name: Verify Windows packaging contracts
        run: node --test apps/desktop/scripts/runtime-deploy-config.test.mjs

      - name: Verify Windows runner protocol
        run: pnpm exec vitest run packages/subprocess/subprocess-local/tests/spawn-runner.spec.ts packages/subprocess/subprocess-local/tests/windows-job.spec.ts

      - name: Prepare bundled plugins
        run: pnpm run prepare:desktop:bundled-plugins

      - name: Build clean-checkout Host and Desktop
        run: pnpm run build:community-desktop

      - name: Deploy Windows runtime
        run: node apps/desktop/scripts/prepare-windows-runtime.mjs

      - name: Build Windows installer
        working-directory: apps/desktop
        run: node node_modules/electron-builder/out/cli/cli.js --win nsis --x64 --publish never

      - name: Probe unpacked app.asar and Electron entries
        run: node apps/desktop/scripts/smoke-windows-unpacked.mjs

      - name: Preserve Windows candidate
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: qualification-windows-x64-candidate
          path: .artifacts/desktop-windows
          if-no-files-found: warn
          retention-days: 3

  windows-smoke:
    name: Smoke Windows x64 candidate
    needs: [bundled-plugins, windows]
    if: >-
      ${{ always() && (inputs.target == 'all' || inputs.target == 'windows-x64') && (
        (inputs.windows_candidate_run_id == '' && needs.windows.result == 'success') ||
        inputs.windows_candidate_run_id != ''
      ) }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Verify reused candidate commit
        if: ${{ inputs.windows_candidate_run_id != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $run = gh api "repos/${{ github.repository }}/actions/runs/${{ inputs.windows_candidate_run_id }}" | ConvertFrom-Json
          if ($run.head_sha -ne '${{ github.sha }}') {
            $allowed = @(
              '.github/workflows/desktop-packages.yml',
              'apps/desktop/scripts/collect-windows-smoke-diagnostics.ps1',
              'apps/desktop/scripts/runtime-deploy-config.test.mjs',
              'apps/desktop/scripts/smoke-windows-package.ps1',
              'apps/desktop/tests/desktop-cli-package.spec.ts',
              'apps/desktop/tests/desktop-packages-workflow.spec.ts'
            )
            git fetch --no-tags --depth=1 origin $run.head_sha
            if ($LASTEXITCODE -ne 0) { throw "Could not fetch candidate commit $($run.head_sha)" }
            $changed = @(git diff --name-only $run.head_sha '${{ github.sha }}')
            if ($LASTEXITCODE -ne 0) { throw "Could not compare candidate commit $($run.head_sha)" }
            $unsafe = @($changed | Where-Object { $_ -notin $allowed })
            if ($unsafe.Count -gt 0) {
              throw "Candidate run commit $($run.head_sha) differs in packaged inputs: $($unsafe -join ', ')"
            }
            Write-Host "Reusing candidate from $($run.head_sha); intervening changes are smoke-only: $($changed -join ', ')"
          }

      - uses: actions/download-artifact@v4
        with:
          name: qualification-windows-x64-candidate
          path: .artifacts/desktop-windows
          run-id: ${{ inputs.windows_candidate_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Smoke test installed Windows package
        shell: pwsh
        run: apps/desktop/scripts/smoke-windows-package.ps1

      - name: Collect Windows smoke diagnostics
        if: ${{ always() }}
        shell: pwsh
        run: apps/desktop/scripts/collect-windows-smoke-diagnostics.ps1

      - name: Preserve Windows smoke diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: qualification-windows-x64-diagnostics
          path: .artifacts/windows-smoke-diagnostics
          if-no-files-found: warn
          retention-days: 3

      - name: Publish qualified Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64
          path: .artifacts/desktop-windows/DeepSeek-Harness-windows-x64.exe
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux x64
    if: ${{ inputs.windows_candidate_run_id == '' && (inputs.target == 'all' || inputs.target == 'linux-x64') }}
    needs: bundled-plugins
    env:
      DSH_BUNDLED_PLUGINS_REFRESH: '0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install package tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq rpm

      - run: pnpm install --frozen-lockfile

      - name: Use resolved bundled plugin snapshot
        run: |
          node -e "require('node:fs').rmSync('apps/desktop/bundled-plugins', { recursive: true, force: true })"

      - uses: actions/download-artifact@v4
        with:
          name: bundled-plugin-snapshot
          path: apps/desktop/bundled-plugins

      - name: Build Linux packages
        run: pnpm run package:desktop:linux:x64

      - name: Verify packaged preset resources
        run: node apps/desktop/scripts/verify-prebuilt-profile.mjs .artifacts/desktop-linux/linux-unpacked/resources

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-x64
          path: |
            .artifacts/desktop-linux/DeepSeek-Harness-linux-x64.deb
            .artifacts/desktop-linux/DeepSeek-Harness-linux-x64.rpm
          if-no-files-found: error
          retention-days: 14

  checksums:
    name: SHA-256 checksums
    needs: [macos, windows-smoke, linux]
    if: >-
      ${{ always() && (
        (inputs.target == 'all' && needs.macos.result == 'success' && needs.windows-smoke.result == 'success' && needs.linux.result == 'success') ||
        (inputs.target == 'macos' && needs.macos.result == 'success') ||
        (inputs.target == 'windows-x64' && needs.windows-smoke.result == 'success') ||
        (inputs.target == 'linux-x64' && needs.linux.result == 'success')
      ) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true

      - name: Write checksums
        working-directory: dist
        run: sha256sum DeepSeek-Harness-* > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-checksums
          path: dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

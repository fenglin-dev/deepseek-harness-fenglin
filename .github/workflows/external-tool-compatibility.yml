name: External tool compatibility

on:
  push:
    branches: [master]
    paths:
      - apps/desktop/external-tools/compatibility.v1.json
      - apps/desktop/scripts/verify-external-tool-compatibility.ts
      - apps/desktop/src/external-tool-compatibility-manifest.ts
      - packages/subagent/subagent-codex/package.json
      - packages/subagent/subagent-claude-code/package.json
      - packages/client/ui-settings-plugin-inventory/src/client/external-tool-compatibility-bridge.ts
      - .github/workflows/external-tool-compatibility.yml
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: external-tool-compatibility
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24.11.1
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify exact providers and platform runtimes
        run: pnpm run verify:desktop:external-tools

      - name: Prepare manifest Release asset
        run: cp apps/desktop/external-tools/compatibility.v1.json external-tools-compatibility.v1.json

      - id: attest
        name: Sign compatibility manifest with GitHub OIDC
        uses: actions/attest@v4
        with:
          subject-path: external-tools-compatibility.v1.json

      - name: Prepare signed attestation asset
        run: cp "${{ steps.attest.outputs.bundle-path }}" external-tools-compatibility.sigstore.json

      - name: Publish rolling compatibility assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view external-tools-compatibility-v1 >/dev/null 2>&1 || \
            gh release create external-tools-compatibility-v1 --title "External tool compatibility v1" --prerelease --latest=false \
              --notes "Signed compatibility coordinates consumed by released desktop clients."
          gh release upload external-tools-compatibility-v1 \
            external-tools-compatibility.v1.json \
            external-tools-compatibility.sigstore.json \
            --clobber

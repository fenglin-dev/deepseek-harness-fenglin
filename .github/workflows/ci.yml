name: CI

on:
  push:
      branches: [main]
        pull_request:
          workflow_dispatch:

          jobs:
            # 基本文件结构检查 - 确保必要的补丁和脚本文件存在
              file-structure-check:
                  runs-on: ubuntu-latest
                      steps:
                            - uses: actions/checkout@v4

                                  - name: 检查必要文件是否存在
                                          run: |
                                                    echo "检查补丁文件..."
                                                              test -f patches/app.asar || echo "::warning::patches/app.asar 不存在"
                                                                        test -f patches/icon.ico || echo "::warning::patches/icon.ico 不存在"

                                                                                  echo "检查脚本文件..."
                                                                                            test -f scripts/apply-patches.ps1 || echo "::warning::scripts/apply-patches.ps1 不存在"

                                                                                                      echo "检查安装程序源码..."
                                                                                                                test -f installer/Installer.cs || echo "::warning::installer/Installer.cs 不存在"
                                                                                                                
                                                                                                                          echo "检查卸载程序源码..."
                                                                                                                                    test -f uninstaller/Uninstaller.cs || echo "::warning::uninstaller/Uninstaller.cs 不存在"
                                                                                                                                    
                                                                                                                                              echo "检查文档..."
                                                                                                                                                        test -f README.md || echo "::warning::README.md 不存在"
                                                                                                                                                                  test -f BUILD.md || echo "::warning::BUILD.md 不存在"
                                                                                                                                                                  
                                                                                                                                                                            echo "文件结构检查完成"
                                                                                                                                                                            
                                                                                                                                                                              # PowerShell 脚本语法检查
                                                                                                                                                                                powershell-lint:
                                                                                                                                                                                    runs-on: ubuntu-latest
                                                                                                                                                                                        steps:
                                                                                                                                                                                              - uses: actions/checkout@v4
                                                                                                                                                                                              
                                                                                                                                                                                                    - name: 安装 PowerShell
                                                                                                                                                                                                            run: |
                                                                                                                                                                                                                      sudo apt-get update
                                                                                                                                                                                                                                sudo apt-get install -y wget apt-transport-https software-properties-common
                                                                                                                                                                                                                                          wget -q "https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb"
                                                                                                                                                                                                                                                    sudo dpkg -i packages-microsoft-prod.deb
                                                                                                                                                                                                                                                              sudo apt-get update
                                                                                                                                                                                                                                                                        sudo apt-get install -y powershell
                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                              - name: 检查 PowerShell 脚本语法
                                                                                                                                                                                                                                                                                      run: |
                                                                                                                                                                                                                                                                                                echo "检查 scripts/apply-patches.ps1 语法..."
                                                                                                                                                                                                                                                                                                          pwsh -Command "\$ErrorActionPreference='Stop'; \$tokens=\$null; \$errors=\$null; [System.Management.Automation.Language.Parser]::ParseFile('scripts/apply-patches.ps1', [ref]\$tokens, [ref]\$errors) | Out-Null; if (\$errors.Count -gt 0) { Write-Host '::error::语法错误:'; \$errors | ForEach-Object { Write-Host \$_.Message }; exit 1 } else { Write-Host '✅ 语法正确' }"
                                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                                            # C# 安装程序编译检查 (Windows)
                                                                                                                                                                                                                                                                                                              build-installer:
                                                                                                                                                                                                                                                                                                                  runs-on: windows-latest
                                                                                                                                                                                                                                                                                                                      steps:
                                                                                                                                                                                                                                                                                                                            - uses: actions/checkout@v4
                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                  - name: 设置 .NET
                                                                                                                                                                                                                                                                                                                                          uses: actions/setup-dotnet@v4
                                                                                                                                                                                                                                                                                                                                                  with:
                                                                                                                                                                                                                                                                                                                                                            dotnet-version: '8.0.x'
                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                  - name: 编译安装程序
                                                                                                                                                                                                                                                                                                                                                                          run: |
                                                                                                                                                                                                                                                                                                                                                                                    echo "编译 installer/Installer.cs..."
                                                                                                                                                                                                                                                                                                                                                                                              $csc = Get-ChildItem "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe" -ErrorAction SilentlyContinue
                                                                                                                                                                                                                                                                                                                                                                                                        if ($csc) {
                                                                                                                                                                                                                                                                                                                                                                                                                    & $csc.FullName /target:winexe /out:installer.exe /win32icon:patches\icon.ico installer\Installer.cs
                                                                                                                                                                                                                                                                                                                                                                                                                                if ($LASTEXITCODE -eq 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                              Write-Host "✅ 安装程序编译成功"
                                                                                                                                                                                                                                                                                                                                                                                                                                                            Test-Path installer.exe
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      Write-Host "::error::安装程序编译失败"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    exit 1
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      Write-Host "::warning::未找到 csc.exe，跳过编译"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      - name: 编译卸载程序
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        echo "编译 uninstaller/Uninstaller.cs..."
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  $csc = Get-ChildItem "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe" -ErrorAction SilentlyContinue
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if ($csc) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        & $csc.FullName /target:winexe /out:uninstaller.exe /win32icon:patches\icon.ico uninstaller\Uninstaller.cs
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if ($LASTEXITCODE -eq 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  Write-Host "✅ 卸载程序编译成功"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                Test-Path uninstaller.exe
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          Write-Host "::warning::卸载程序编译失败（可能需要调整）"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            Write-Host "::warning::未找到 csc.exe，跳过编译"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        # 补丁文件完整性检查
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          patch-integrity:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              runs-on: ubuntu-latest
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  steps:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        - uses: actions/checkout@v4
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              - name: 检查 dshmarket 补丁文件
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                echo "检查 dshmarket 补丁目录..."
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          if [ -d "patches/dshmarket" ]; then
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      echo "✅ dshmarket 补丁目录存在"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  find patches/dshmarket -type f -name "*.js" | head -20
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            else
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        echo "::warning::patches/dshmarket 目录不存在"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  fi
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        - name: 验证 app.asar 文件大小
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          if [ -f patches/app.asar ]; then
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      SIZE=$(stat -c%s patches/app.asar)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  echo "app.asar 文件大小: $SIZE bytes"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if [ "$SIZE" -lt 1000000 ]; then
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            echo "::warning::app.asar 文件可能过小 (< 1MB)"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        else
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      echo "✅ app.asar 文件大小合理"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  fi
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            fi
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            

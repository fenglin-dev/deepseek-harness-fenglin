# The `liangshen` (梁神模式) agent preset: the builtin Minimal preset's
# one-line persona — extended with the mode's standing working discipline and
# the session's workspace directory — as the WHOLE system prompt, with the
# session's tool surface staged behind the anchor turn and PTC presentation
# taking over after it. The session's entire first user turn runs the anchored native
# surface — the short persona block plus the default `anchorTools`
# schemas (`[bash, str_replace_editor, exit_plan_mode, skill]`), natively presented —
# and from the second turn this session presents its tools in PTC mode (when
# successfully activated): the wire carries the single `run_code`
# transport, and every other tool is reached from inside the program through
# the generated SDK. The capability facts the Standard system prompt would
# carry as tool-guidance prose — and, under PTC, the SDK bindings and the
# collapse rule that `minimal-prompt` filters out of the prompt along with
# every other section — arrive instead as a durable `tool-catalog` message
# appended after the user's own message from the FIRST turn on, the way the
# skill catalog is injected; it names exactly the tools the current request
# opens (each tool's argument signature plus a one-line summary) — the anchor
# set natively during the anchor turn, the SDK-reachable roster under PTC —
# so the declared surface and the request's own wire never disagree. The one
# wire transition is the deterministic turn boundary: no reasoning-block
# gating, no output budget cap.
#
# The persistent shell replaces the Standard ephemeral shell for the whole
# session (both register the name `bash`), and the editor inherits the host
# file sandbox instead of mounting a bare local filesystem — see the shell and
# filesystem sections below.
#
# Adapted from the builtin `minimal` and `standard` presets.
#
# This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
# standing scope; every session naming it joins by scope parentage, so the
# tools and prompt sections registered here cover each joined agent while a
# session's own state stays keyed per Session/Agent inside the plugins. The
# host composition (`base.cordis.yml` + `web.cordis.yml`) keeps everything a
# preset must not own: the registries themselves, the sandbox and approval
# stack, persistence, and the model route.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# Without one it publishes into the root realm, where it is process-global —
# another preset publishing the same name collides, and a host reader would
# resolve one preset's instance for every session; `dsh-agent-presets` rejects
# that at mount. `true` means an entry-local realm: this standing mount's own
# private instance, apart from every other preset's. (A shared label does NOT
# pool instances — `provide()` throws on the second registration under the
# same realm symbol; labels join REALMS, and are not what this file needs.)

# ── identity ────────────────────────────────────────────────────────────────

# The persona prefix below is the preset's entire system prompt base:
# `minimal-prompt` narrows the assembled sections down to it (plus plan mode's
# `plan:policy`, which no tool restriction backs — see that plugin) and
# appends the session's workspace directory at assembly time, so identity,
# harness, web-surface, and tool-guidance sections never reach the model.
# Besides the one-line persona it carries the standing working discipline the
# mode ships with (thinking loops, design-first reasoning, YAGNI/PDCA, no
# code comments). Runtime context snapshots stay enabled: they are durable
# user-role messages, not system-prompt text.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: |-
      You are a helpful software engineer assistant.

      - Avoid falling into repetitive loops during thinking; exit immediately once a loop is detected.
      - Focus thinking on requirement understanding and solution design (key points, workflow, verification strategy), without pre-rehearsing specific code implementation. Code should be output during the "Do" phase based on the actual state of files, with correctness verified by the "Check" phase.
      - When writing code, follow the YAGNI programming philosophy and the PDCA behavioral standard.
      - No need to write comments for the code.

# The two halves of the mode, both preset-local plugins:
#
# `minimal-prompt` keeps the system prompt on the persona above, plus the
# session's workspace directory appended at assembly time (`Your working
# directory is <cwd>.` — the one orientation fact the persona block carries).
# It also lifts the AGENTS.md-style instruction files into the system prompt
# itself: at assembly time it reads the harness's baseline chain
# ($DSH_HOME/AGENTS.md, then the project root's ancestors down to the cwd) and
# appends the content as one `workspace-instructions` section after the stable
# prefix, re-read on every request so file edits propagate, and drops the
# harness's own agent-instructions injections (they would duplicate the
# prompt). Set `instructionSource: hint` to restore the one-time non-imperative
# pointer to the reference files instead (issue #388, upstream
# dsh-anchored-standard #49: a full-text dump as context measurably flips the
# anchored trajectory), or `keepPlanPolicy: false` to drop plan mode's policy
# section as well.
#
# `tool-catalog` appends the model-visible tool catalog — each tool's argument
# signature plus a one-line summary — as a durable user message after the
# user's own message from the first turn on, the way `dsh-tool-skill` injects
# the skill catalog. It republishes only when that catalog's content changes or
# the published copy left the visible surface (compaction, resume), so the
# catalog is not appended once per step. The content follows the presentation
# the next request will carry: the anchor wire before the boundary, the SDK
# roster after it. `descriptionMaxLength` caps each one-line summary; the full
# description stays in the tool schema.
#
# `anchorTools` stages the tool SCHEMAS behind the anchor turn: during the
# session's entire first user turn the assembled wire narrows to these schemas
# and the session keeps native presentation, and the catalog narrows with the
# wire, so the model is never told about a tool this request does not expose.
# The shipped default anchor tools are `[bash, str_replace_editor, exit_plan_mode, skill]`.
# The bash-only configuration experiment (`anchorTools: [bash]`) is preserved
# and supported via config without requiring extra preset registration or
# registry changes. Set it to an empty list to disable the narrowing entirely.
#
# `ptcPresentation` declares this session's tools in PTC mode from the second
# turn on (when successfully activated): the wire collapses to the reserved
# `run_code` transport and every other tool is reached inside the program through
# the generated SDK, which the injected catalog names because `minimal-prompt`
# filters the harness's own `tools:sdk` and `tools:ptc-only` sections out of the
# prompt. The SDK preserves full input and output key parameter semantics rather
# than a rigid short-summary contract. The declaration is per session
# (`agent.ctx.tools.presentAs`), needs a mounted code runtime, and degrades to
# the native surface with a one-time warning when either is missing or fails.
# Set `false` to restore the pre-PTC behavior: the full native roster on the
# wire from the second turn.
- id: minimal-prompt
  name: ./minimal-prompt.mjs
  config:
    keepPlanPolicy: true
    instructionSource: system-prompt
    instructionMaxBytes: 65536

- id: tool-catalog
  name: ./tool-catalog.mjs
  config:
    descriptionMaxLength: 200
    anchorTools: [bash, str_replace_editor, exit_plan_mode, skill]
    ptcPresentation: true

# The harness's workspace-instruction loader. Under the default
# `instructionSource: system-prompt` the content reaches the model through the
# system prompt instead, and this row's injections are dropped by
# `minimal-prompt`; the row stays mounted so `instructionSource: hint` keeps
# its pointer behavior working, and its `maxBytes` remains that mode's budget.
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# The PTY registry is an agent-owned service, so it lives in an entry-local
# realm. The backend still consumes the host sandbox policy and subprocess
# implementation, while the tool registers into this agent's scoped catalog.
# This persistent `bash` replaces the Standard ephemeral shell for the WHOLE
# session (both tools register the name `bash`), so shell state survives across
# calls.
- id: persistent-shell
  name: cordis:group
  group: true
  disabled: !!js process.platform === 'win32'
  isolate:
    terminals: true
  config:
    - id: pty
      name: '@deepseek-ai/dsh-terminal'

    - id: terminal-bash
      name: '@deepseek-ai/dsh-terminal-bash'
      config:
        timeoutMs: 300000

    - id: persistent-bash
      name: '@deepseek-ai/dsh-tool-bash-persistent'
      config:
        timeoutMs: 300000
        description: |-
          Run commands in a bash shell
          * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
          * You don't have access to the internet via this tool.
          * You do have access to a mirror of common linux and python packages via apt and pip.
          * State is persistent across command calls and discussions with the user.
          * To inspect a particular line range of a file, e.g. lines 10-25, try 'sed -n 10,25p /path/to/the/file'.
          * Please avoid commands that may produce a very large amount of output.
          * Please run long lived commands in the background, e.g. 'sleep 10 &' or start a server in the background.

# Windows-only `bash` tool (custom-bash.mjs): the PTY backend above is
# linux/darwin-only, so win32 disables the persistent-shell group and
# registers this `bash` through the ordinary cross-platform subprocess seam
# (Git Bash). Both platforms end up with exactly one tool named `bash`.
# Non-zero exit is reported not thrown; state does NOT persist across calls on
# this path; no OS sandbox confinement on Windows. `bashPath` is optional
# (defaults to Git Bash inference); set it explicitly when git is not on PATH.
- id: custom-bash
  name: ./custom-bash.mjs
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# The editor is a direct top-level row: it reuses the host's sandboxed
# `ctx.fs`, not a bare local filesystem. No `dsh-fs-local` realm is mounted, so
# it inherits the host file sandbox exactly like every Standard file tool, and
# the model-facing schema stays the builtin Minimal `str_replace_editor`.
- id: str-replace-editor
  name: '@deepseek-ai/dsh-tool-str-replace-editor'
  config:
    maxOutputChars: 16000

# ── standard filesystem tools ───────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane:
# its producers sit outside any realm this file could put it in, and the
# registry is keyed by owning agent anyway. With the persistent shell, long
# commands run through `&`; these controls still expose whatever the host
# registry tracks.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
# `skill-filesystem` contributes local-root discovery for agents on this preset, and
# `tool-skill` gives them the catalog and loader; the merged catalog also
# carries whatever the deployment registered globally (repository plugins).
# The `skill-catalog` pre-step message stays current like any other injection.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# Only the model-facing tool. The goal SERVICE, its session driver, and the
# `/goal` command stay on the host plane: the Gateway serves the goal domain as
# Remote endpoints whose receiver comes from a generated descriptor, so it
# resolves `goals` on the host and an entry-local realm here would hide it. The
# registry is keyed by session anyway, so one host instance serves every
# session. What a preset chooses is whether its agent can call the goal tool.
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime. `minimal-prompt` keeps this
# row's `plan:policy` section in the otherwise one-line system prompt, because
# the section is the only thing that enforces plan mode: the exit tool stays
# registered in every mode and no tool restriction backs the policy.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it.
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane, and the rows here resolve that one instance. It takes no configuration,
# keys every fold by Session, and owns the context-meter projection units the
# browser reads for every session — behind a realm those units would come and go
# with whichever presets happen to be mounted. What a preset chooses is whether
# its agent compacts at all, which is `compaction-basic` below.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition: the registry is a process singleton whose cross-session queries
# the api-proxy serves to the browser, and a provider name may only be
# registered once. This preset contributes the delegation TOOLS, which resolve
# that host registry.
#
# `workflows` is different — nothing outside an agent reads it — so every row
# that reaches it shares one entry-local realm here, and a consumer left
# outside would resolve a host registry this preset does not populate.
#
# `tool-subagent-report` is host-plane for the same reason as the registry,
# not because a preset may not want it: it registers a CONTINUABLE SETUP on
# that singleton rather than a tool this agent calls, and the setup list is
# not scope-aware — one copy per mounted preset means every child gets
# `report` registered once per live session, which throws on the second.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Product providers are host-plane singletons. Copy this preset, then
    # remove `disabled` from either ordinary tool row to expose that product
    # only to agents composed from the copy.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn
      disabled: true

    # Keep the engine above for `ralph`, but do not publish a second
    # model-authored orchestration surface beside `run_code`: this is the one
    # roster difference the builtin `ptc` preset ships with, and the mode's
    # whole promoted surface is run_code.
    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'
      disabled: true

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64
      disabled: true

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

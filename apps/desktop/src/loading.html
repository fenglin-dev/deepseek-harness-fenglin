<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
    <title>DeepSeek Harness</title>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f2ed; color: #24221f; }
      main { width: min(420px, calc(100vw - 48px)); text-align: center; }
      .mark { width: 52px; height: 52px; margin: 0 auto 24px; border-radius: 16px; background: #24221f; color: #fff; display: grid; place-items: center; font: 700 22px/1 ui-monospace, monospace; box-shadow: 0 12px 32px rgb(36 34 31 / 16%); }
      h1 { margin: 0; font-size: 22px; letter-spacing: -0.02em; }
      p { margin: 12px 0 28px; color: #706c65; font-size: 14px; line-height: 1.6; }
      .progress-meta { align-items: center; display: flex; gap: 16px; justify-content: space-between; margin: 0 0 9px; text-align: left; }
      .progress-task { color: #4f4b45; font-size: 13px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .progress-percent { color: #706c65; flex: none; font: 600 12px/1 ui-monospace, monospace; }
      .track { height: 4px; overflow: hidden; border-radius: 999px; background: #dedbd4; }
      .bar { width: 4%; height: 100%; border-radius: inherit; background: #3f7f67; transition: width 220ms ease-out; }
      .failure { margin-top: 22px; text-align: left; }
      .slow { margin-top: 22px; text-align: left; }
      .failure[hidden], .slow[hidden], .progress-surface[hidden] { display: none; }
      .failure-message { color: #a12b27; margin: 0 0 10px; }
      .log-path { background: rgb(36 34 31 / 6%); border-radius: 8px; color: inherit; font: 12px/1.5 ui-monospace, monospace; margin: 0 0 16px; overflow-wrap: anywhere; padding: 10px 12px; }
      .actions { display: flex; flex-wrap: wrap; gap: 10px; }
      .directory-error { color: #a12b27; font-size: 13px; margin: -6px 0 14px; }
      .directory-error[hidden] { display: none; }
      button { border: 1px solid #c9c5bd; border-radius: 8px; background: #fff; color: inherit; cursor: pointer; font: inherit; padding: 8px 13px; }
      button.primary { background: #24221f; border-color: #24221f; color: #fff; }
      button:disabled { cursor: wait; opacity: .6; }
      @media (prefers-reduced-motion: reduce) { .bar { transition: none; } }
      @media (prefers-color-scheme: dark) { body { background: #1b1b1a; color: #f3f1ec; } .mark { background: #f3f1ec; color: #1b1b1a; } p, .progress-percent { color: #aaa69f; } .progress-task { color: #d2cfc9; } .track { background: #343330; } .log-path { background: rgb(255 255 255 / 8%); } button { background: #292826; border-color: #4a4843; } button.primary { background: #f3f1ec; border-color: #f3f1ec; color: #1b1b1a; } }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">DS</div>
      <h1 id="title">Starting DeepSeek Harness</h1>
      <p id="description">Checking plugin compatibility and preparing your local agent workspace. Your sessions and credentials stay on this machine.</p>
      <div id="progress-surface" class="progress-surface">
        <div class="progress-meta" aria-live="polite">
          <span id="progress-task" class="progress-task">Preparing desktop environment</span>
          <span id="progress-percent" class="progress-percent">4%</span>
        </div>
        <div id="progress" class="track" role="progressbar" aria-label="Starting DeepSeek Harness" aria-valuemin="0" aria-valuemax="100" aria-valuenow="4">
          <div id="progress-bar" class="bar"></div>
        </div>
      </div>
      <section id="slow" class="slow" aria-live="polite" hidden>
        <p id="slow-message"></p>
        <div class="actions">
          <button id="open-slow-log" type="button">Open Harness log</button>
        </div>
      </section>
      <section id="failure" class="failure" role="alert" hidden>
        <p id="failure-message" class="failure-message"></p>
        <p id="log-path" class="log-path"></p>
        <p id="directory-error" class="directory-error" role="status" hidden></p>
        <div class="actions">
          <button id="retry" class="primary" type="button">Retry</button>
          <button id="switch-data-home" type="button">Switch data directory</button>
          <button id="open-logs" type="button">Open log folder</button>
        </div>
      </section>
    </main>
  </body>
</html>
